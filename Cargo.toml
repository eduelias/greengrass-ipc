[package]
name = "greengrass-ipc"
version = "0.2.0"
edition = "2021"
rust-version = "1.94.1"
description = "Unofficial pure-Rust async client for AWS IoT Greengrass v2 on-device component IPC (nucleus IPC over the Unix domain socket)."
documentation = "https://docs.rs/greengrass-ipc"
repository = "https://github.com/eduelias/greengrass-ipc"
license = "Apache-2.0 OR MIT"
keywords = ["greengrass", "iot", "ipc", "aws", "eventstream"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"
exclude = [".github/", "scripts/", "docs/social-card.png", "docs/social-card.svg", "examples/docker/"]

[features]
default = []

[dependencies]
tokio = { version = "1", features = ["net", "rt", "sync", "io-util", "time", "macros"] }
# Only the 0.61 line is exercised; the surface used here (MessageFrameDecoder,
# write_message_to, Message, Header) is stable across its patch releases. Kept as a
# caret range rather than an exact pin so a consumer that also depends on an AWS SDK
# crate can unify on a compatible version.
aws-smithy-eventstream = "0.61"
aws-smithy-types = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Only `futures_core::Stream`, which `EventStream` implements. Callers that want the
# `StreamExt` combinators (`.next()`) depend on `futures-util` themselves.
futures-core = "0.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
aws-smithy-eventstream = "0.61"
aws-smithy-types = "1"
bytes = "1"
futures-util = "0.3"
serde_json = "1"
